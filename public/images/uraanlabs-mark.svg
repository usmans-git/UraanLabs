<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" role="img" aria-label="UraanLabs Mark">
  <defs>
    <linearGradient id="mark_bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141728" />
      <stop offset="100%" stop-color="#080911" />
    </linearGradient>
    <linearGradient id="m_core" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="m_flight" x1="40" y1="90" x2="100" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="m_facet" x1="10" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="m_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#mark_bg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" />

  <g transform="translate(10, 10)">
    <polygon points="18,34 38,20 42,66 18,72" fill="url(#m_facet)" opacity="0.95" />
    <polygon points="18,72 42,66 58,84 36,90" fill="url(#m_core)" />
    <polygon points="58,84 42,66 74,10 94,10" fill="url(#m_flight)" filter="url(#m_glow)" />
    <polygon points="94,10 82,42 66,78 58,84" fill="#0284C7" opacity="0.85" />
    <polygon points="38,20 54,32 50,60 42,66" fill="#A5B4FC" opacity="0.3" />
    <circle cx="94" cy="10" r="4" fill="#38BDF8" />
  </g>
