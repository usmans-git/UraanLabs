<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%" fill="none" role="img" aria-label="UraanLabs Logo">
  <defs>
    <linearGradient id="c1_core" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="c1_flight" x1="40" y1="90" x2="100" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="c1_facet" x1="10" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="c1_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- EMBLEM: The Stealth Falcon Ascent (Faceted 3D Monogram) -->
  <g transform="translate(10, 8)">
    <polygon points="18,34 38,20 42,66 18,72" fill="url(#c1_facet)" opacity="0.95" />
    <polygon points="18,72 42,66 58,84 36,90" fill="url(#c1_core)" />
    <polygon points="58,84 42,66 74,10 94,10" fill="url(#c1_flight)" filter="url(#c1_glow)" />
    <polygon points="94,10 82,42 66,78 58,84" fill="#0284C7" opacity="0.85" />
    <polygon points="38,20 54,32 50,60 42,66" fill="#A5B4FC" opacity="0.3" />
    <circle cx="94" cy="10" r="4" fill="#38BDF8" />
  </g>

  <!-- TYPOGRAPHY: Ultra-Sharp Modern Geometric -->
  <g transform="translate(122, 22)">
    <text x="0" y="42" font-family="'Sora', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      Uraan
    </text>
    <text x="130" y="42" font-family="'Sora', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="url(#c1_flight)">
      Labs
    </text>
    <!-- Studio Subtitle -->
    <g transform="translate(0, 52)">
      <text x="0" y="10" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#94A3B8">
        VENTURE &amp; AI STUDIO
      </text>
    </g>
  </g>
</svg>
