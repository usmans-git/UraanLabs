    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="190" height="150" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2F80FF" flood-opacity="0.14"/>
