  <g filter="url(#softGlow)">
    <path d="M120.25 37.75C109.25 27.25 94.45 20.8 78.15 20.8C44.15 20.8 16.6 48.35 16.6 82.35C16.6 116.35 44.15 143.9 78.15 143.9C94.8 143.9 109.9 137.3 120.95 126.55" stroke="url(#markGradient)" stroke-width="14" stroke-linecap="round"/>
    <path d="M117.4 29.65H149.6L100.3 75.1L149.6 120.5H117.4L71.35 79.75C68.35 77.1 68.35 72.45 71.35 69.8L117.4 29.65Z" fill="url(#markGradient)"/>
    <path d="M117.15 57.35L152.55 75.05L117.15 92.8L128.85 75.05L117.15 57.35Z" fill="url(#accentGradient)"/>
    <path d="M82.5 75H148.6" stroke="url(#arrowGradient)" stroke-width="13" stroke-linecap="square"/>
    <path d="M139.4 52.65L169.2 75.05L139.4 97.4L150.75 75.05L139.4 52.65Z" fill="#2F80FF"/>
