<svg width="520" height="150" viewBox="0 0 520 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kodvanta Logo</title>
  <desc id="desc">Kodvanta wordmark with a stylized K, forward arrows, deep indigo and electric blue gradients.</desc>
  <defs>
    <linearGradient id="markGradient" x1="33" y1="120" x2="150" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050B35"/>
      <stop offset="0.55" stop-color="#1028B6"/>
      <stop offset="1" stop-color="#2F80FF"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="98" y1="75" x2="164" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F2FF"/>
      <stop offset="0.22" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#5B2EFF"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="122" y1="54" x2="170" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B2EFF"/>
